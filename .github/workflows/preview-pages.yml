name: Preview to GitHub Pages

# Publishes an in-progress redesign to the Pages site without going near the
# live one.
#
# `main` is push-to-publish: a commit there runs deploy-hostinger.yml straight
# onto the commercial domain. That is the right behaviour for finished work and
# exactly the wrong behaviour for something half-built, so this workflow exists
# to give unfinished branches a real URL.
#
# It reads only from `preview/**`, and deploy-hostinger.yml reads only from
# `main`, so nothing on a preview branch can reach the live site — the
# separation is the branch name, not a flag anyone has to remember to set.
#
# A repository has one Pages site, so this does replace whatever is currently
# at the project URL until `main` next deploys over it.

on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          # A project site is served from /<repo>/, so asset URLs and the
          # canonical/OG/sitemap URLs all have to know about the subpath.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Sources live in pages/*.html, so Rollup names the built HTML
      # dist/pages/*.html — every route would otherwise deploy one level too
      # deep, at /ad-pro/pages/x.html instead of /ad-pro/x.html.
      - name: Flatten built pages to dist root
        run: |
          mv dist/pages/*.html dist/
          rmdir dist/pages

      # A preview is not a thing anyone should find in a search result. The
      # live site's own robots.txt is generated by the build; this replaces it
      # for the duration of the preview only, and `main` regenerates the real
      # one the moment it deploys.
      # Written as a block scalar: the body contains a colon followed by a
      # space, which YAML reads as a nested mapping in a plain inline scalar
      # and rejects the whole file — the run then fails before any job starts.
      - name: Keep the preview out of search results
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
