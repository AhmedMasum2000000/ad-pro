name: Deploy to GitHub Pages

# This is the live deploy path: Pages Source for this repository is "GitHub
# Actions", so this workflow's upload-pages-artifact/deploy-pages steps are
# what actually publishes — the repo root being pre-built (see
# scripts/publish-root.mjs) only matters if Source is ever switched back to
# "Deploy from a branch". Confirmed by the first successful run of this
# workflow, which requires the site to already exist -- the earlier "Resource
# not accessible by integration" failure was this same workflow being unable
# to CREATE that site on a repo whose Actions token was still read-only, not
# evidence Actions could never deploy here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish; queued
# runs collapse to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement: true` turns Pages on via the API if it is not already,
      # so a fresh repository needs no manual visit to the settings page.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          # A project site is served from /<repo>/, so asset URLs and the
          # canonical/OG/sitemap URLs all have to know about the subpath.
          # vite.config.ts normalises the trailing slash.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Sources live in pages/*.html (see README's "Repository layout"), so
      # Rollup names the built HTML dist/pages/*.html — every route would
      # otherwise deploy one level too deep, at /ad-pro/pages/x.html instead
      # of /ad-pro/x.html.
      - name: Flatten built pages to dist root
        run: |
          mv dist/pages/*.html dist/
          rmdir dist/pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
