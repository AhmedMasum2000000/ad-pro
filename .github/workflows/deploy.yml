name: Deploy to GitHub Pages

# Manual-only, on purpose.
#
# Pages for this repository is set to "Deploy from a branch", which serves
# the branch contents verbatim — so the built site is committed at the
# repository root (see scripts/publish-root.mjs) and no workflow is needed
# to publish. Leaving a `push` trigger here would fail on every commit,
# because a repository whose Actions token is read-only cannot create or
# deploy a Pages site.
#
# If you later switch Settings -> Pages -> Source to "GitHub Actions", run
# this once from the Actions tab and it takes over from there; at that point
# committing the built root becomes optional.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish; queued
# runs collapse to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement: true` turns Pages on via the API if it is not already,
      # so a fresh repository needs no manual visit to the settings page.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          # A project site is served from /<repo>/, so asset URLs and the
          # canonical/OG/sitemap URLs all have to know about the subpath.
          # vite.config.ts normalises the trailing slash.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
